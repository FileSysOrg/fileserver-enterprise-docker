services:
  jfileserver:
    image: filesysorg/jfileserver-enterprise:1.3.1
    environment:
      JFSRV_SMBDIALECTS: "SMB2,SMB3"
      JFSRV_FTP_ENABLE: false
      JFSRV_FTP_PORT: 1121
      JFSRV_NFS_ENABLE: false
    ports:
      - "445:445"
      - "8080:8080"
      - "8000:8000"
    volumes:
      - <MAP-TO-A-LOCAL-FOLDER>:/jfileserver/fileShare
#      - <MAP-TO-A-LOCAL-FOLDER>:/jfileserver/licence
    depends_on:
      - jfileserver-postgres

  jfileserver-postgres:
    image: postgres:9.6
    environment:
      POSTGRES_DB: jfileserver
      POSTGRES_USER: jfileserver
      POSTGRES_PASSWORD: fileserver
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "5432:5432"
    volumes:
      - jfileserver-db-volume:/var/lib/postgresql/data

volumes:
  jfileserver-data-volume:
    external: true
  jfileserver-db-volume:
    external: true
